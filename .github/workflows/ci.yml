name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # install-crystal apt-installs dev libraries; a stale package index 404s.
      - name: Refresh apt index and install liblzma
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -qy liblzma-dev
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Check formatting
        if: matrix.name == 'linux-x86_64'
        run: make lint
      - name: Run specs
        run: make spec
      - name: Build release binary
        run: make release
      # Grows the rind for this platform and compiles a document that needs an aril.
      - name: Compile a document
        run: |
          mkdir -p smoke
          printf '%s\n' '\documentclass{article}' '\usepackage{booktabs,xcolor}' \
            '\begin{document}' '\textcolor{blue}{Hello} from pomtex.' '\end{document}' > smoke/hello.tex
          bin/pomtex --version
          bin/pomtex build --rind smoke/hello.tex
          test -s smoke/hello.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: pomtex-${{ matrix.name }}
          path: bin/pomtex

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      # Crystal's Windows package ships every static library pomtex links except liblzma.
      - name: Install liblzma
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install liblzma:x64-windows-static
          lib="$(cygpath -w "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib")"
          echo "CRYSTAL_LIBRARY_PATH=$(crystal env CRYSTAL_LIBRARY_PATH);$lib" >> "$GITHUB_ENV"
      - name: Run specs
        run: crystal spec
      - name: Build release binary
        run: |
          mkdir -p bin
          crystal build src/pomtex.cr -o bin/pomtex.exe --release --no-debug --static
      - name: Compile a document
        run: |
          mkdir -p smoke
          printf '%s\n' '\documentclass{article}' '\usepackage{booktabs,xcolor}' \
            '\begin{document}' '\textcolor{blue}{Hello} from pomtex.' '\end{document}' > smoke/hello.tex
          bin/pomtex.exe --version
          bin/pomtex.exe build --rind smoke/hello.tex
          test -s smoke/hello.pdf
      # install.ps1 from a zip laid out like the release one, into a fresh PATH entry.
      - name: Install script
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/pomtex-ci-windows-x86_64 | Out-Null
          Copy-Item bin/pomtex.exe, README.md, LICENSE dist/pomtex-ci-windows-x86_64/
          Compress-Archive dist/pomtex-ci-windows-x86_64 dist/pomtex-ci.zip
          $env:POMTEX_ZIP = "$PWD/dist/pomtex-ci.zip"
          $env:POMTEX_INSTALL_DIR = "$env:RUNNER_TEMP\pomtex-bin"
          ./install.ps1
          pomtex --version
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $env:POMTEX_INSTALL_DIR) { throw 'PATH not updated' }
      # The way most people run it: Windows PowerShell 5.1, piped into iex.
      - name: Install script (Windows PowerShell, iex)
        shell: powershell
        run: |
          $env:POMTEX_ZIP = "$PWD/dist/pomtex-ci.zip"
          $env:POMTEX_INSTALL_DIR = "$env:RUNNER_TEMP\pomtex-bin-51"
          Get-Content ./install.ps1 -Raw | Invoke-Expression
          & "$env:POMTEX_INSTALL_DIR\pomtex.exe" --version
      - uses: actions/upload-artifact@v4
        with:
          name: pomtex-windows-x86_64
          path: bin/pomtex.exe
