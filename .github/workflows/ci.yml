name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install-crystal apt-installs dev libraries; a stale package index 404s.
      - name: Refresh apt index
        run: sudo apt-get update -q
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Check formatting
        run: make lint
      - name: Run specs
        run: make spec
      - name: Build release binary
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: pomtex-linux-x86_64
          path: bin/pomtex
