name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  static-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        run: |
          shard="v$(awk '/^version:/ {print $2; exit}' shard.yml)"
          code="v$(sed -n 's/.*VERSION = "\(.*\)"/\1/p' src/config.cr)"
          echo "tag=$GITHUB_REF_NAME shard.yml=$shard config.cr=$code"
          test "$shard" = "$GITHUB_REF_NAME" && test "$code" = "$GITHUB_REF_NAME"

      - name: Build static binary (Alpine, musl)
        run: make static

      - name: Package
        run: |
          name="pomtex-${GITHUB_REF_NAME#v}-linux-x86_64"
          mkdir -p "dist/$name"
          cp bin/pomtex README.md LICENSE "dist/$name/"
          mkdir -p "dist/$name/share"
          for shell in bash fish zsh; do bin/pomtex completions "$shell" > "dist/$name/share/pomtex.$shell"; done
          bin/pomtex manpage > "dist/$name/share/pomtex.1"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Build .deb and .rpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP" nfpm
          version="${GITHUB_REF_NAME#v}"
          cp -r "dist/pomtex-$version-linux-x86_64" dist/pkg
          gzip -9n dist/pkg/share/pomtex.1
          for packager in deb rpm; do
            VERSION="$version" "$RUNNER_TEMP/nfpm" package -f packaging/nfpm.yaml -p "$packager" -t dist/
          done
          (cd dist && for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done)
          cat dist/*.sha256
        env:
          NFPM_VERSION: "2.47.0"

      - name: Smoke test
        run: |
          file dist/pomtex-*/pomtex
          dist/pomtex-*/pomtex --version
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sha256 \
            --title "pomtex $GITHUB_REF_NAME" --generate-notes
