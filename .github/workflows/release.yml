name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  static-linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            pkgarch: amd64
          - os: ubuntu-24.04-arm
            arch: aarch64
            pkgarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        run: |
          shard="v$(awk '/^version:/ {print $2; exit}' shard.yml)"
          code="v$(sed -n 's/^ *VERSION = "\(.*\)"/\1/p' src/config.cr)"
          echo "tag=$GITHUB_REF_NAME shard.yml=$shard config.cr=$code"
          test "$shard" = "$GITHUB_REF_NAME" && test "$code" = "$GITHUB_REF_NAME"

      - name: Build static binary (Alpine, musl)
        run: make static

      - name: Package
        run: |
          name="pomtex-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp bin/pomtex README.md LICENSE "dist/$name/"
          mkdir -p "dist/$name/share"
          for shell in bash fish zsh; do bin/pomtex completions "$shell" > "dist/$name/share/pomtex.$shell"; done
          bin/pomtex manpage > "dist/$name/share/pomtex.1"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Build .deb and .rpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}.tar.gz" | tar -xz -C "$RUNNER_TEMP" nfpm
          version="${GITHUB_REF_NAME#v}"
          cp -r "dist/pomtex-$version-linux-${{ matrix.arch }}" dist/pkg
          gzip -9n dist/pkg/share/pomtex.1
          for packager in deb rpm; do
            VERSION="$version" ARCH="${{ matrix.pkgarch }}" "$RUNNER_TEMP/nfpm" package -f packaging/nfpm.yaml -p "$packager" -t dist/
          done
          (cd dist && for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done)
          cat dist/*.sha256
        env:
          NFPM_VERSION: "2.47.0"

      - name: Smoke test
        run: |
          file dist/pomtex-*/pomtex
          dist/pomtex-*/pomtex --version
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sha256

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      # Crystal's Windows package ships every static library pomtex links except liblzma.
      - name: Install liblzma
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install liblzma:x64-windows-static
          lib="$(cygpath -w "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib")"
          echo "CRYSTAL_LIBRARY_PATH=$(crystal env CRYSTAL_LIBRARY_PATH);$lib" >> "$GITHUB_ENV"

      # Statically linked, including the C runtime: only system DLLs are needed.
      - name: Build static binary
        run: |
          mkdir -p bin
          crystal build src/pomtex.cr -o bin/pomtex.exe --release --no-debug --static

      - name: Package
        run: |
          name="pomtex-${GITHUB_REF_NAME#v}-windows-x86_64"
          mkdir -p "dist/$name"
          cp bin/pomtex.exe README.md LICENSE "dist/$name/"
          (cd dist && 7z a -tzip -bso0 "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")

      - name: Smoke test
        run: |
          dist/pomtex-*/pomtex.exe --version
          # Only system DLLs (no vcruntime140.dll), so it runs on a fresh Windows.
          objdump -p dist/pomtex-*/pomtex.exe | grep "DLL Name" | sort || true

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.zip
            dist/*.sha256

  publish:
    needs: [static-linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "pomtex $GITHUB_REF_NAME" --generate-notes
